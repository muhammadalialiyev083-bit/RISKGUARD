name: Verify application

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium
      - name: Isolated browser tests
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 5207 > /tmp/uzhi-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:5207/ > /dev/null && break
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:5207/ > /dev/null
          export EXPERIENCE_BASE_URL=http://127.0.0.1:5207
          export REPORT_BASE_URL=http://127.0.0.1:5207
          npm run test:experience
          npm run test:reports
          npm run test:motion
          npm run test:effects
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEBUG: "True"
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python manage.py check
      - run: python manage.py migrate --noinput
      - run: python -m pytest --cov=apps --cov=bcms_backend --cov-report=term-missing --cov-fail-under=85
      - run: python -m pip_audit -r requirements.txt
