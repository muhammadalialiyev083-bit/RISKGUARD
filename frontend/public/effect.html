      let flight = (time-delay)/.75;
      if(flight>1) flight = (time-delay-2.85)/.75;
      const point = line.getPointAtLength(clamp(flight)*line.getTotalLength());
      attrs(pulses[i],{cx:point.x,cy:point.y,opacity:flight>0&&flight<1 ? back : 0});
    });
    window.__time = raw;
  }
  function tick(now) {
    if(last) seconds += (now-last)/1000;
    last = now;
    draw(seconds);
    frame = requestAnimationFrame(tick);
  }
  function sync() {
    cancelAnimationFrame(frame); last=0;
    window.__playing = Boolean(window.__ready && playing && !document.hidden && (!media.matches || manualMotion));

  }

    manualMotion=Boolean(active && userInitiated);

    if(active) hasPlayed=true;
    if(window.__ready) draw(seconds);
    sync();

  window.seek = value => { playing=false; manualMotion=false; seconds=Number.isFinite(Number(value)) ? Math.max(0,Number(value)) : 0; sync(); draw(seconds); };
  window.addEventListener('message', event => {
    if(event.origin!==location.origin || event.source!==parent || event.data?.type!=='uzhi-motion') return;

  byId('playback-replay').addEventListener('click', () => requestPlayback(true, true, true));
  document.addEventListener('visibilitychange',sync);
  media.addEventListener('change',() => { manualMotion=false; if(media.matches) { playing=false; seconds=4.4; if(window.__ready) draw(seconds); } sync(); });
  Promise.all([document.fonts.load('550 43px Montserrat'),new Promise(resolve=>{const image=new Image();image.onload=image.onerror=resolve;image.src=byId('logo').getAttribute('href');})]).then(() => {
    draw(seconds); window.__ready=true; sync();
  });
})();
