<script>
(() => {

  const query = new URLSearchParams(location.search);
  const media = matchMedia('(prefers-reduced-motion: reduce)');
  const byId = id => document.getElementById(id);
  const clamp = x => Math.max(0, Math.min(1, x));
  const ease = x => { x = clamp(x); return x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3)/2; };
  const lerp = (a,b,p) => a+(b-a)*p;
  const attrs = (el, values) => { for (const [key,value] of Object.entries(values)) el.setAttribute(key,String(value)); };
  const lines = [...document.querySelectorAll('.lit-path')];
  const pulses = [...document.querySelectorAll('.pulse')];
  const nodes = [...document.querySelectorAll('.node')];
  const initial = Number(query.get('t'));
  let seconds = query.has('t') && Number.isFinite(initial) ? Math.max(0, initial) : media.matches ? 4.4 : 0;
  let last = 0, frame = 0, playing = !query.has('render') && !media.matches, manualMotion = false;
  let hasPlayed = playing;
  const controls = byId('standalone-controls'), toggle = byId('playback-toggle');
  controls.hidden = parent !== window || query.has('render');
  function draw(raw) {
    const time = query.get('mode') === 'hold' ? Math.min(Math.max(0,raw),6.6) : ((raw % 8)+8)%8;
    const back = time > 6.6 ? 1-ease((time-6.6)/1.4) : 1;
    const move = ease(time/2.2)*back;
    const x = lerp(140,136,move), y = lerp(490,124,move), w = lerp(560,1648,move), h = lerp(176,820,move);
    for(const id of ['shell','clip']) attrs(byId(id),{x,y,width:w,height:h});
    attrs(byId('shared-title'),{x:lerp(178,208,move),y:lerp(558,198,move),'font-size':lerp(43,36,move)});
    attrs(byId('card-subtitle'),{x:178,y:608,opacity:1-clamp(move*3)});
    attrs(byId('card-arrow'),{transform:`translate(${lerp(617,1700,move)} ${lerp(576,184,move)})`,opacity:1-clamp(move*3)});
    const content = ease((time-.75)/1.2)*back;
    byId('workspace').setAttribute('opacity',String(content));
    byId('headline').setAttribute('transform',`translate(0 ${18*(1-content)})`);
    attrs(byId('ghost'),{opacity:move*.13});
    attrs(byId('guides'),{d:`M140 490L${x} ${y}M700 666L${x+w} ${y+h}`,opacity:Math.sin(move*Math.PI)*.26});
    nodes.forEach((node,i) => {
      const entrance = ease((time-.8-i*.12)/.8)*back;
      node.setAttribute('transform',`translate(0 ${16*(1-entrance)})`);
      node.setAttribute('opacity',String(entrance));
      const arrival = i === 0 ? .95 : i === 3 ? 2.1 : 1.6+i*.14;
      const wave = Math.max(0,1-Math.abs(time-arrival)/.55,1-Math.abs(time-arrival-2.85)/.55)*back;
      node.querySelector('.node-response').setAttribute('opacity',String(wave*.8));

      const delay = i < 2 ? 1 : 1.5;
      line.setAttribute('stroke-dashoffset',String(1-ease((time-delay)/.7)*back));
      let flight = (time-delay)/.75;
      if(flight>1) flight = (time-delay-2.85)/.75;
      const point = line.getPointAtLength(clamp(flight)*line.getTotalLength());
      attrs(pulses[i],{cx:point.x,cy:point.y,opacity:flight>0&&flight<1 ? back : 0});
    });

  }

    if(last) seconds += (now-last)/1000;
    last = now;
    draw(seconds);
    frame = requestAnimationFrame(tick);
  }

    window.__playing = Boolean(window.__ready && playing && !document.hidden && (!media.matches || manualMotion));
    toggle.textContent = playing ? 'To‘xtatish' : 'Ijro etish';
    toggle.setAttribute('aria-label', playing ? 'Animatsiyani to‘xtatish' : 'Animatsiyani ijro etish');
    if(window.__playing) frame=requestAnimationFrame(tick);

    if(reset) seconds=0;
    manualMotion=Boolean(active && userInitiated);
    playing=active;
    if(active) hasPlayed=true;
    if(window.__ready) draw(seconds);
    sync();
  }
  window.seek = value => { playing=false; manualMotion=false; seconds=Number.isFinite(Number(value)) ? Math.max(0,Number(value)) : 0; sync(); draw(seconds); };
  window.addEventListener('message', event => {
    if(event.origin!==location.origin || event.source!==parent || event.data?.type!=='uzhi-motion') return;
    requestPlayback(!event.data.paused, event.data.userInitiated === true, event.data.reset === true);
  });
  toggle.addEventListener('click', () => requestPlayback(!playing, true, !playing && !hasPlayed));
  byId('playback-replay').addEventListener('click', () => requestPlayback(true, true, true));
  document.addEventListener('visibilitychange',sync);
  media.addEventListener('change',() => { manualMotion=false; if(media.matches) { playing=false; seconds=4.4; if(window.__ready) draw(seconds); } sync(); });
  Promise.all([document.fonts.load('550 43px Montserrat'),new Promise(resolve=>{const image=new Image();image.onload=image.onerror=resolve;image.src=byId('logo').getAttribute('href');})]).then(() => {
    draw(seconds); window.__ready=true; sync();
  });
})();
</script>
