<!doctype html>
<html lang="uz">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>UzHi — Jarayondan tiklanish rejasigacha</title>
<style>
@font-face{font-family:UzHiPlex;font-weight:100 700;src:url("data:font/woff2;base64,__FONT__") format("woff2")}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#102433;color:#EDF3F3;font-family:UzHiPlex,sans-serif}
svg{display:block;width:100%;height:100%;font-family:UzHiPlex,sans-serif}text{fill:#EDF3F3}.muted{fill:#AAC0CA}.accent{fill:#52CAB4}
.node-shell{fill:#1D3A4C;stroke:#315064;stroke-width:2}.node-response{fill:none;stroke:#52CAB4;stroke-width:3;opacity:0}.connector{fill:none;stroke:#315064;stroke-width:3}.lit-path{fill:none;stroke:#52CAB4;stroke-width:3;stroke-linecap:round}.pulse{fill:#70D9C5}
#standalone-controls{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:8px;padding:6px;border:1px solid #315064;border-radius:10px;background:#162F40}
#standalone-controls[hidden]{display:none}#standalone-controls button{min-height:44px;padding:8px 16px;border:1px solid #315064;border-radius:6px;background:#1D3A4C;color:#EDF3F3;font:500 14px UzHiPlex,sans-serif;white-space:nowrap;cursor:pointer}#standalone-controls button:focus-visible{outline:2px solid #52CAB4;outline-offset:2px}
</style>
<svg viewBox="0 0 1920 1080" role="img" aria-labelledby="title description">
  <title id="title">UzHi ish jarayoni</title>
  <desc id="description">Jarayon va resurslarni aniqlashdan BIA hamda riskni baholash orqali BCP va DRP tiklanish rejasigacha. Bir kartochka yagona boshqaruv maydoniga ochiladi.</desc>
  <defs>
    <radialGradient id="ambient"><stop stop-color="#52CAB4" stop-opacity=".10"/><stop offset="1" stop-color="#102433" stop-opacity="0"/></radialGradient>
    <linearGradient id="surface" x2="1" y2="1"><stop stop-color="#162F40"/><stop offset="1" stop-color="#102433"/></linearGradient>
    <clipPath id="shell-clip"><rect id="clip" rx="28"/></clipPath>
  </defs>
  <rect width="1920" height="1080" fill="#102433"/>
  <ellipse cx="1330" cy="560" rx="800" ry="600" fill="url(#ambient)"/>
  <image id="logo" href="data:image/webp;base64,__LOGO__" x="140" y="35" width="210" height="70"/>
  <text x="1780" y="78" text-anchor="end" class="muted" font-size="21" letter-spacing="3">JARAYONDAN TIKLANISHGACHA</text>
  <rect id="ghost" x="140" y="490" width="560" height="176" rx="28" fill="none" stroke="#52CAB4" stroke-dasharray="7 9" opacity="0"/>
  <path id="guides" fill="none" stroke="#52CAB4" stroke-width="1.5" stroke-dasharray="6 10" opacity="0"/>
  <rect id="shell" fill="url(#surface)" stroke="#315064" stroke-width="2" rx="28"/>
  <g clip-path="url(#shell-clip)">
    <g id="workspace" opacity="0">
      <path d="M136 234H1784" stroke="#315064"/>
      <circle cx="1680" cy="184" r="5" fill="#52CAB4"/><circle cx="1704" cy="184" r="5" fill="#AAC0CA" opacity=".5"/><circle cx="1728" cy="184" r="5" fill="#AAC0CA" opacity=".3"/>
      <g id="headline"><text x="208" y="337" font-size="54" font-weight="550">Har bir qadam — yagona tizimda.</text></g>
      <text x="208" y="389" class="muted" font-size="25">Jarayonni aniqlang. Ta’sirni baholang. Tiklanishni rejalang.</text>
      <g id="paths">
        <path class="connector" d="M548 578C658 578 680 520 790 520"/>
        <path class="connector" d="M548 578C658 578 680 681 790 681"/>
        <path class="connector" d="M1120 520C1250 520 1242 596 1372 596"/>
        <path class="connector" d="M1120 681C1250 681 1242 596 1372 596"/>
        <path class="lit-path" pathLength="1" stroke-dasharray="1" d="M548 578C658 578 680 520 790 520"/>
        <path class="lit-path" pathLength="1" stroke-dasharray="1" d="M548 578C658 578 680 681 790 681"/>
        <path class="lit-path" pathLength="1" stroke-dasharray="1" d="M1120 520C1250 520 1242 596 1372 596"/>
        <path class="lit-path" pathLength="1" stroke-dasharray="1" d="M1120 681C1250 681 1242 596 1372 596"/>
        <circle class="pulse" r="5"/><circle class="pulse" r="5"/><circle class="pulse" r="5"/><circle class="pulse" r="5"/>
      </g>
      <g class="node" data-node="0">
        <rect class="node-shell" x="208" y="498" width="340" height="160" rx="18"/>
        <rect class="node-response" x="208" y="498" width="340" height="160" rx="18"/>
        <text x="236" y="535" class="accent" font-size="18" letter-spacing="2">01 · ANIQLASH</text>
        <text x="236" y="586" font-size="31" font-weight="550">Jarayonlar</text>
        <text x="236" y="625" class="muted" font-size="21">Xizmatlar va resurslar</text>
      </g>
      <g class="node" data-node="1">
        <rect class="node-shell" x="790" y="454" width="330" height="132" rx="18"/>
        <rect class="node-response" x="790" y="454" width="330" height="132" rx="18"/>
        <text x="818" y="492" class="accent" font-size="18" letter-spacing="2">02 · BAHOLASH</text>
        <text x="818" y="535" font-size="29" font-weight="550">Biznes ta’siri · BIA</text>
        <text x="818" y="565" class="muted" font-size="19">Tiklanish talablari</text>
      </g>
      <g class="node" data-node="2">
        <rect class="node-shell" x="790" y="615" width="330" height="132" rx="18"/>
        <rect class="node-response" x="790" y="615" width="330" height="132" rx="18"/>
        <text x="818" y="653" class="accent" font-size="18" letter-spacing="2">02 · BAHOLASH</text>
        <text x="818" y="696" font-size="29" font-weight="550">Risklar reestri</text>
        <text x="818" y="726" class="muted" font-size="19">Ehtimollik × ta’sir</text>
      </g>
      <g class="node" data-node="3">
        <rect class="node-shell" x="1372" y="516" width="340" height="160" rx="18"/>
        <rect class="node-response" x="1372" y="516" width="340" height="160" rx="18"/>
        <text x="1400" y="553" class="accent" font-size="18" letter-spacing="2">03 · REJALASH</text>
        <text x="1400" y="604" font-size="29" font-weight="550">BCP / DRP rejalari</text>
        <text x="1400" y="643" class="muted" font-size="21">Mas’ullar va qadamlar</text>
      </g>
      <path d="M208 815H1712" stroke="#315064"/>
      <text x="208" y="872" class="muted" font-size="22">Biznesingiz davom etishi uchun.</text>
      <text x="1712" y="872" text-anchor="end" class="accent" font-size="22">UzHi · Uzluksiz Himoya</text>
    </g>
    <text id="shared-title" font-weight="550">Uzluksiz himoya</text>
    <text id="card-subtitle" class="muted" font-size="23">Jarayon. Baholash. Tiklanish.</text>
    <g id="card-arrow" fill="none" stroke="#52CAB4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M0 0H32M20-12 32 0 20 12"/></g>
  </g>
  <text x="140" y="1015" class="muted" font-size="21">UZLUKSIZ HIMOYA</text>
  <text x="1780" y="1015" text-anchor="end" class="muted" font-size="21">Aniq jarayonlar. Boshqariladigan tiklanish.</text>
</svg>
<div id="standalone-controls" role="group" aria-label="Animatsiyani boshqarish" hidden>
  <button id="playback-toggle" type="button">Ijro etish</button>
  <button id="playback-replay" type="button">Qayta</button>
</div>
<script>
(() => {
  'use strict';
  const query = new URLSearchParams(location.search);
  const media = matchMedia('(prefers-reduced-motion: reduce)');
  const byId = id => document.getElementById(id);
  const clamp = x => Math.max(0, Math.min(1, x));
  const ease = x => { x = clamp(x); return x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3)/2; };
  const lerp = (a,b,p) => a+(b-a)*p;
  const attrs = (el, values) => { for (const [key,value] of Object.entries(values)) el.setAttribute(key,String(value)); };
  const lines = [...document.querySelectorAll('.lit-path')];
  const pulses = [...document.querySelectorAll('.pulse')];
  const nodes = [...document.querySelectorAll('.node')];
  const initial = Number(query.get('t'));
  let seconds = query.has('t') && Number.isFinite(initial) ? Math.max(0, initial) : media.matches ? 4.4 : 0;
  let last = 0, frame = 0, playing = !query.has('render') && !media.matches, manualMotion = false;
  let hasPlayed = playing;
  const controls = byId('standalone-controls'), toggle = byId('playback-toggle');
  controls.hidden = parent !== window || query.has('render');
  function draw(raw) {
    const time = query.get('mode') === 'hold' ? Math.min(Math.max(0,raw),6.6) : ((raw % 8)+8)%8;
    const back = time > 6.6 ? 1-ease((time-6.6)/1.4) : 1;
    const move = ease(time/2.2)*back;
    const x = lerp(140,136,move), y = lerp(490,124,move), w = lerp(560,1648,move), h = lerp(176,820,move);
    for(const id of ['shell','clip']) attrs(byId(id),{x,y,width:w,height:h});
    attrs(byId('shared-title'),{x:lerp(178,208,move),y:lerp(558,198,move),'font-size':lerp(43,36,move)});
    attrs(byId('card-subtitle'),{x:178,y:608,opacity:1-clamp(move*3)});
    attrs(byId('card-arrow'),{transform:`translate(${lerp(617,1700,move)} ${lerp(576,184,move)})`,opacity:1-clamp(move*3)});
    const content = ease((time-.75)/1.2)*back;
    byId('workspace').setAttribute('opacity',String(content));
    byId('headline').setAttribute('transform',`translate(0 ${18*(1-content)})`);
    attrs(byId('ghost'),{opacity:move*.13});
    attrs(byId('guides'),{d:`M140 490L${x} ${y}M700 666L${x+w} ${y+h}`,opacity:Math.sin(move*Math.PI)*.26});
    nodes.forEach((node,i) => {
      const entrance = ease((time-.8-i*.12)/.8)*back;
      node.setAttribute('transform',`translate(0 ${16*(1-entrance)})`);
      node.setAttribute('opacity',String(entrance));
      const arrival = i === 0 ? .95 : i === 3 ? 2.1 : 1.6+i*.14;
      const wave = Math.max(0,1-Math.abs(time-arrival)/.55,1-Math.abs(time-arrival-2.85)/.55)*back;
      node.querySelector('.node-response').setAttribute('opacity',String(wave*.8));
    });
    lines.forEach((line,i) => {
      const delay = i < 2 ? 1 : 1.5;
      line.setAttribute('stroke-dashoffset',String(1-ease((time-delay)/.7)*back));
      let flight = (time-delay)/.75;
      if(flight>1) flight = (time-delay-2.85)/.75;
      const point = line.getPointAtLength(clamp(flight)*line.getTotalLength());
      attrs(pulses[i],{cx:point.x,cy:point.y,opacity:flight>0&&flight<1 ? back : 0});
    });
    window.__time = raw;
  }
  function tick(now) {
    if(last) seconds += (now-last)/1000;
    last = now;
    draw(seconds);
    frame = requestAnimationFrame(tick);
  }
  function sync() {
    cancelAnimationFrame(frame); last=0;
    window.__playing = Boolean(window.__ready && playing && !document.hidden && (!media.matches || manualMotion));
    toggle.textContent = playing ? 'To‘xtatish' : 'Ijro etish';
    toggle.setAttribute('aria-label', playing ? 'Animatsiyani to‘xtatish' : 'Animatsiyani ijro etish');
    if(window.__playing) frame=requestAnimationFrame(tick);
  }
  function requestPlayback(active, userInitiated, reset) {
    if(reset) seconds=0;
    manualMotion=Boolean(active && userInitiated);
    playing=active;
    if(active) hasPlayed=true;
    if(window.__ready) draw(seconds);
    sync();
  }
  window.seek = value => { playing=false; manualMotion=false; seconds=Number.isFinite(Number(value)) ? Math.max(0,Number(value)) : 0; sync(); draw(seconds); };
  window.addEventListener('message', event => {
    if(event.origin!==location.origin || event.source!==parent || event.data?.type!=='uzhi-motion') return;
    requestPlayback(!event.data.paused, event.data.userInitiated === true, event.data.reset === true);
  });
  toggle.addEventListener('click', () => requestPlayback(!playing, true, !playing && !hasPlayed));
  byId('playback-replay').addEventListener('click', () => requestPlayback(true, true, true));
  document.addEventListener('visibilitychange',sync);
  media.addEventListener('change',() => { manualMotion=false; if(media.matches) { playing=false; seconds=4.4; if(window.__ready) draw(seconds); } sync(); });
  Promise.all([document.fonts.load('550 43px UzHiPlex'),new Promise(resolve=>{const image=new Image();image.onload=image.onerror=resolve;image.src=byId('logo').getAttribute('href');})]).then(() => {
    draw(seconds); window.__ready=true; sync();
  });
})();
</script>
</html>
